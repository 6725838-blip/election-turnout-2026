<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ballot-box mark (no emoji fonts — reliable in browser tabs) -->
  <rect width="32" height="32" rx="6" fill="#0b1218"/>
  <!-- box -->
  <rect x="6" y="12" width="20" height="14" rx="2" fill="#1a2833" stroke="#7ddeb8" stroke-width="1.5"/>
  <!-- slot -->
  <rect x="10" y="15" width="12" height="2.2" rx="1" fill="#0b1218"/>
  <!-- ballot paper sticking up -->
  <rect x="12.5" y="5" width="7" height="11" rx="1" fill="#eef2f0"/>
  <!-- check mark on ballot -->
  <path d="M14.2 10.2l2 2.1 3.2-3.6" fill="none" stroke="#0d6b58" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
