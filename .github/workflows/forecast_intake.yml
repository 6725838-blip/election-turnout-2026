name: Accept forecast submission
# Anonymous browser POSTs repository_dispatch; this job writes under forecasts/submissions/.
on:
  repository_dispatch:
    types: [forecast_submit]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forecast-intake
  cancel-in-progress: false
jobs:
  accept:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Accept submission
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PYTHONPATH: scripts
        run: python3 scripts/accept_forecast.py
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- forecasts/submissions forecasts-public.json; then
            echo "No forecast changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/submissions forecasts-public.json
          git commit -m "Add shared election forecast submission"
          git push origin HEAD:main
          echo "Forecast submission committed." >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild public snapshot
        env:
          PYTHONPATH: scripts
        run: python3 scripts/rebuild_forecasts.py
      - name: Commit when changed
        run: |
          if git diff --quiet -- forecasts-public.json; then
            echo "Snapshot unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts-public.json
          git commit -m "Rebuild forecast contest public snapshot"
          git push origin HEAD:main
