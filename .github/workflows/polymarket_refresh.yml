name: Refresh Polymarket snapshot
on:
  schedule:
    # GitHub may delay cron under load; */10 is more reliable than */5.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polymarket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh Polymarket snapshot
        run: python3 scripts/update_polymarket.py
      - name: Commit when snapshot changed
        id: commit
        run: |
          if git diff --quiet -- polymarket-pm.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polymarket-pm.json
          git commit -m "Refresh Polymarket same-origin snapshot"
          # GITHUB_TOKEN pushes do not re-trigger workflows — deploy Pages here.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Package site
        if: steps.commit.outputs.changed == 'true'
        run: python3 scripts/prepare_site.py
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
        # Deploy without environment protection so scheduled runs are not blocked.
