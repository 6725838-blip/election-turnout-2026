name: Refresh Polymarket snapshot
# GitHub `schedule` cron never fires on this repo (0 schedule runs ever).
# Instead: self-chain via workflow_dispatch + sleep (public repo = free minutes).
on:
  workflow_dispatch:
  # Kept as a free bonus if GitHub cron ever starts working.
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/polymarket_refresh.yml'
      - 'scripts/update_polymarket.py'
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: polymarket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh Polymarket snapshot
        id: snap
        continue-on-error: true
        run: python3 scripts/update_polymarket.py
      - name: Commit when snapshot changed
        id: commit
        if: steps.snap.outcome == 'success'
        run: |
          if git diff --quiet -- polymarket-pm.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polymarket-pm.json
          git commit -m "Refresh Polymarket same-origin snapshot"
          # GITHUB_TOKEN push does not re-trigger workflows — Pages deploy below.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Package site
        if: steps.commit.outputs.changed == 'true'
        run: python3 scripts/prepare_site.py
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Wait then queue next refresh
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ~8 minutes between snapshots (runner sleep is free on public repos).
          sleep 480
          gh workflow run "Refresh Polymarket snapshot" --ref main
          echo "Queued next Polymarket refresh." >> "$GITHUB_STEP_SUMMARY"
