name: Refresh Polymarket snapshot
on:
  schedule:
    # About every 5 minutes — keeps same-origin JSON fresh for NetFree clients.
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polymarket-refresh
  cancel-in-progress: true
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh Polymarket snapshot
        run: python3 scripts/update_polymarket.py
      - name: Commit and deploy when snapshot changed
        id: commit
        run: |
          if git diff --quiet -- polymarket-pm.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polymarket-pm.json
          git commit -m "Refresh Polymarket same-origin snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package site
        if: steps.commit.outputs.changed == 'true'
        run: python3 scripts/prepare_site.py
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
