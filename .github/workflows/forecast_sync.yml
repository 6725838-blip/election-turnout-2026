name: Rebuild forecast contest snapshot
# Local-repo source of truth: forecasts/submissions/*.json (+ optional forecasts/truth.json).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecasts/**'
      - 'scripts/forecast_contest.py'
      - 'scripts/rebuild_forecasts.py'
      - '.github/workflows/forecast_sync.yml'
permissions:
  contents: write
concurrency:
  group: forecast-rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild forecasts-public.json
        run: python3 scripts/rebuild_forecasts.py
      - name: Commit when snapshot changed
        run: |
          if git diff --quiet -- forecasts-public.json; then
            echo "Forecast snapshot unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts-public.json
          git commit -m "Rebuild forecast contest same-origin snapshot"
          git push origin HEAD:main
